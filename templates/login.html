<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Student Assistant AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">

<div class="auth-page">

  <!-- Brand strip -->
  <div class="auth-brand">
    <svg class="auth-brand__logo" width="36" height="36" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="7" fill="#EAA700"/>
      <path d="M16 7L27 13v6L16 25 5 19v-6L16 7Z" stroke="#3A0F34" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3.5" fill="#3A0F34"/>
    </svg>
    <span class="auth-brand__name">Student Assistant AI</span>
  </div>

  <!-- Card -->
  <div class="auth-card">
    <h1 class="auth-card__heading">Welcome Back!</h1>
    <p class="auth-card__sub">Continue your learning journey.</p>

    {% if error %}
    <div class="auth-alert" role="alert" aria-live="polite">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10 6v5M10 13v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <form class="auth-form" method="POST" action="{{ url_for('login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>

      <div class="auth-field">
        <label class="auth-label" for="email">Email address</label>
        <input
          class="auth-input"
          type="email"
          id="email"
          name="email"
          value="{{ email_val }}"
          placeholder="you@example.com"
          autocomplete="email"
          required
          aria-required="true"
        />
      </div>

      <div class="auth-field">
        <div class="auth-label-row">
          <label class="auth-label" for="password">Password</label>
          <a class="auth-link auth-link--sm" href="{{ url_for('forgot_password') }}">Forgot password?</a>
        </div>
        <div class="auth-input-wrap">
          <input
            class="auth-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            aria-required="true"
          />
          <button type="button" class="auth-eye" aria-label="Show password" data-target="password">
            <svg class="eye-show" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-hide" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="auth-row">
        <label class="auth-check">
          <input type="checkbox" name="remember" value="1"/>
          <span class="auth-check__box" aria-hidden="true"></span>
          <span>Remember me for 7 days</span>
        </label>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span class="auth-btn__text">Sign In</span>
        <span class="auth-btn__spinner" hidden aria-hidden="true"></span>
      </button>
    </form>

    <p class="auth-footer-text">
      Don't have an account?
      <a class="auth-link" href="{{ url_for('signup') }}">Create one free</a>
    </p>
  </div>

  <p class="auth-tagline">Learn Smarter. Study Better. Achieve More.</p>
</div>

<script>
(function(){
  // Show/hide password toggle
  document.querySelectorAll(".auth-eye").forEach(function(btn){
    btn.addEventListener("click", function(){
      var inp = document.getElementById(btn.dataset.target);
      var show = inp.type === "password";
      inp.type = show ? "text" : "password";
      btn.querySelector(".eye-show").hidden = show;
      btn.querySelector(".eye-hide").hidden = !show;
      btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  });
  // Prevent double-submit
  document.querySelector(".auth-form").addEventListener("submit", function(){
    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.querySelector(".auth-btn__text").hidden = true;
    btn.querySelector(".auth-btn__spinner").hidden = false;
  });
})();
</script>
</body>
</html>
